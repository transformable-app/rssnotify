packages:
  - '.'

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  # GHSA-vfj7-8cjw-p6xm: fixed nesting/traversal cap; remove after an official fix is verified.
  braces@3.0.3: patches/braces@3.0.3.patch

overrides:
  'fast-copy': '3.1.0'
  '@babel/core': '>=7.29.6 <8.0.0'
  'file-type': '21.3.4'
  'fast-xml-parser': '>=5.7.0'
  'fast-xml-builder': '>=1.1.7'
  esbuild: '0.28.1'
  rollup: '^4.64.5'
  minimatch: '>=10.2.3'
  undici: '7.29.1'
  flatted: '>=3.4.2'
  picomatch: '>=4.0.4'
  brace-expansion: '5.0.12'
  nodemailer: '10.0.9'
  postcss: '8.5.25'
  'postcss-selector-parser': '7.1.6'
  fast-uri: '4.1.5'
  qs: '>=6.16.0'
  uuid: '>=14.0.0'
  yaml: '>=1.10.3'
  ws: '>=8.21.0'
  'payload>ajv': '>=8.18.0'
  dompurify: '3.4.16'
  nanoid: '3.3.18'
  immutable: '>=5.1.8'
  js-yaml: '5.4.1'
  lodash: '>=4.18.0'
  mongoose: '8.24.1'
  sharp: '0.35.5'
  'source-map-js': '1.2.2'
  vite: '7.3.5'

minimumReleaseAgeExclude:
  - '@payloadcms/admin-bar'
  - '@payloadcms/db-mongodb'
  - '@payloadcms/email-nodemailer'
  - '@payloadcms/graphql'
  - '@payloadcms/live-preview-react'
  - '@payloadcms/live-preview'
  - '@payloadcms/next'
  - '@payloadcms/plugin-form-builder'
  - '@payloadcms/plugin-nested-docs'
  - '@payloadcms/plugin-redirects'
  - '@payloadcms/plugin-search'
  - '@payloadcms/plugin-seo'
  - '@payloadcms/richtext-lexical'
  - '@payloadcms/translations'
  - '@payloadcms/ui'
  - payload
  - '@next/env@16.4.2'
  - '@next/eslint-plugin-next@16.4.2'
  - '@next/swc-darwin-arm64@16.4.2'
  - '@next/swc-darwin-x64@16.4.2'
  - '@next/swc-linux-arm64-gnu@16.4.2'
  - '@next/swc-linux-arm64-musl@16.4.2'
  - '@next/swc-linux-x64-gnu@16.4.2'
  - '@next/swc-linux-x64-musl@16.4.2'
  - '@next/swc-win32-arm64-msvc@16.4.2'
  - '@next/swc-win32-x64-msvc@16.4.2'
  - eslint-config-next@16.4.2
  - next@16.4.2
